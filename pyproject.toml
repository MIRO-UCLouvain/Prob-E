[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rt-probabilistic-evaluation"
version = "0.1.0"
description = "A package for probabilistic evaluation in radiation therapy"
requires-python = ">=3.12"
authors = [
  { name = "Matijs Geerts" },
  { name = "Romain Schyns" },
  { name = "Eliot Peeters" }
]
dependencies = [
    "numpy>=2.3.2,<3.0",
    "scipy>=1.11,<2.0",
    "opentps>=3.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0,<8.0",
  "ruff>=0.0.297,<1.0"
]


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]