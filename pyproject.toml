[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rt-probabilistic-evaluation"
version = "0.1.0"
description = "A package for probabilistic evaluation in radiation therapy"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Matijs Geerts" },
  { name = "Romain Schyns" },
  { name = "Eliot Peeters" }
]
dependencies = [
    "numpy>=1.3.2,<3.0",
    "scipy>=1.11,<2.0",
    "pydicom>=2.4",
    "pandas>=2.0.3,<3.0",
    "matplotlib>=3.7.1,<4.0",
    "scikit-image>=0.21,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0,<8.0",
  "ruff>=0.0.297,<1.0"
]
# Needed to use Probabilistic_Evaluation.ui (clinical goals editor + results viewer)
ui = [
  "streamlit>=1.42,<2.0",
  "streamlit-aggrid>=1.0,<2.0"
]

[project.scripts]
# Both require the `ui` extra at runtime; without it, the command exits with a clear error.
rt-eval-goals   = "Probabilistic_Evaluation.ui.clinicalGoalsEditor:_cli"
rt-view-results = "Probabilistic_Evaluation.ui.resultsViewer:_cli"


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]