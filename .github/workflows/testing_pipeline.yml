name: testing_pipeline.yml
run-name: Setup Python and run tests
on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # "dev" alone makes sure the package still imports and tests pass without the
        # optional ui extra (streamlit) installed; "dev,ui" covers the ui-enabled path.
        extras: ["dev", "dev,ui"]

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v2

    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ".[${{ matrix.extras }}]"

    - name: 🧪 Run pytest
      run: |
        pytest
      continue-on-error: false

    - name: 🔍 format with ruff
      run: |
        ruff format .

    - name: 🔍 Lint with ruff
      run: |
        ruff check . --fix
      continue-on-error: true
